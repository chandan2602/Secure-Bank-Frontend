<div class="login-container">
  <div class="login-card">
    <!-- Left Section -->

    <div class="left-section">
      <div class="logo">🏦</div>

      <h1>SecureBank</h1>

      <p>Experience secure, fast and convenient banking with advanced digital services.</p>

      <div class="features">
        <p>✔ Secure Login</p>
        <p>✔ Instant Transfers</p>
        <p>✔ 24/7 Banking Access</p>
        <p>✔ Trusted by Millions</p>
      </div>
    </div>

    <!-- Right Section -->

    <div class="right-section">
      <h2>Welcome Back</h2>

      <p class="subtitle">Login to continue your banking journey</p>

      <form>
        <div class="input-group">
          <label>Email</label>
          <input
            type="text"
            name="email"
            placeholder="Enter your email"
            [(ngModel)] = 'loginPayload.email'
            
          />
        </div>

        <div class="input-group">
          <label>Password</label>

          <div class="password-box">
            <input
              
              name="password"
              placeholder="Enter your password"
              [(ngModel)] = 'loginPayload.password'
              
            />

            <span class="eye" name = "isshow"  > 👁️ </span>
          </div>
        </div>

        <div class="extra-links">
          <label>
            <input type="checkbox" />
            Remember Me
          </label>

          <a href="#">Forgot Password?</a>
        </div>

        <button type="button" (click)="OnLogin()">Login</button>
      </form>

      <div class="register-link">
        Don't have an account?
        <a routerLink="/register"> Create Account </a>
      </div>
    </div>
  </div>
</div>
