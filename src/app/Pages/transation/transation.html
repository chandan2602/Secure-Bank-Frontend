<div class="page-container">
  <app-sidebar></app-sidebar>

  <div class="page-header">
    <h1>Transaction History</h1>
    <p>View and track all your banking activities.</p>
  </div>

  <div class="summary-cards">
    <div class="card">
      <h3>Total Transactions</h3>
      <h2>156</h2>
    </div>

    <div class="card">
      <h3>Total Credits</h3>
      <h2>₹1,25,000</h2>
    </div>

    <div class="card">
      <h3>Total Debits</h3>
      <h2>₹85,000</h2>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>S.No</th>
          <th>Full Name</th>
          <th>Mobile No</th>
          <th>Email</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let i of transation; let index = index" >
          <td >{{ index + 1 }}</td>
          <td>{{ i.full_name }}</td>
          <td>{{ i.mobile_number }}</td>
          <td>{{ i.email }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
